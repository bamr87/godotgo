name: Claude Code

# Mention @claude in an issue, a pull request, or a review comment and Claude
# works in this repository with the framework's own commands available to it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Godot and gdtoolkit
        uses: ./.github/actions/setup-godot

      - uses: anthropics/claude-code-action@v1
        with:
          # Generated locally with `claude setup-token` (Pro, Max, Team or
          # Enterprise subscription) and stored as a repository secret.
          # Swap for anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} to bill the API instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(tools/check.sh*),Bash(tools/test.sh*),Bash(tools/smoke.sh*),Bash(tools/verify.sh*),Bash(tools/new_game.sh*),Bash(tools/godot.sh --headless*),Bash(python3 tools/gen_assets.py*)"
