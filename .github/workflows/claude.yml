name: Claude

# kit: agent-context v0.6.0
# @claude mention handler, seeded from bamr87/bamr87 templates/agent-context/.
# Mention @claude in an issue or PR comment and Claude Code picks up the task.
#
# Built to the fleet's harness standard (bamr87/bamr87 _data/fleet.yml
# `harnesses.standard`, docs/HARNESS-OPS.md): a trusted-author gate, an exact
# model, a dollar ceiling, the ordered credential, least-privilege permissions
# and a timeout.
#
# This copy is the kit's body PLUS three things godotgo needs, each marked
# `godotgo:` below: write permissions on the job, the setup-godot step and the
# --allowedTools list. It therefore does not match the kit byte for byte, and
# the hub's upgrade fan-out leaves an edited copy alone: carry a kit release
# over by hand (diff against templates/agent-context/claude.yml) and keep
# those three.
#
# Auth: tried in the order this repo's CLAUDE_AUTH_ORDER variable names —
# `oauth` = CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), `api_key` =
# ANTHROPIC_API_KEY. Set per repo or group in bamr87/bamr87 _data/fleet.yml
# `ai_auth:`; unset means the fleet default, oauth then api_key.
# See bamr87/bamr87 docs/AI-INTEGRATION.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

# One Claude run at a time per issue/PR thread. Without this, several @claude
# mentions in quick succession each spin up their own 30-minute agent against
# the same thread, racing each other on the same branch.
#
# Deliberately NOT cancel-in-progress: each mention is a distinct request and
# the agent commits and pushes, so a superseded run is queued behind the current
# one rather than killed mid-push.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    # Only trusted authors can start a run. On a public repo anyone can open an
    # issue or comment, and an @claude mention spends the repo's Claude
    # credential and hands the text to an agent with a checkout — so the
    # mention must come from someone with write-level standing. The
    # author_association is read from the object that carries the @claude text
    # (the comment, the review, or the issue itself).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # godotgo: write where the kit reads. Claude works in this repository
      # with the framework's commands: it commits to a branch, opens pull
      # requests and comments on issues.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # godotgo: the framework's own commands (tools/check.sh, tools/verify.sh
      # and the rest of the allowlist below) need the pinned Godot and
      # gdtoolkit on the runner.
      - name: Install Godot and gdtoolkit
        uses: ./.github/actions/setup-godot

      # The credential comes from this repo's CLAUDE_AUTH_ORDER (ai_auth: in
      # bamr87/bamr87 _data/fleet.yml) — a method NAME, never a secret, in the output.
      - name: Choose the Claude credential (ai_auth order)
        id: claude-auth
        uses: bamr87/bamr87/.github/actions/claude-auth@v2
        with:
          order: ${{ vars.CLAUDE_AUTH_ORDER }}
          has-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.claude-auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.claude-auth.outputs.method == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          # The model is an exact id from the fleet's allowlist (bamr87/bamr87
          # _data/fleet.yml `ai_models.allowed`), never an alias and never the
          # action's default of the day. The dollar ceiling is a circuit
          # breaker, not a budget: a mention is the one HUMAN-triggered call
          # site, so there is no turn cap to size against, but it is unattended
          # spend the moment the person who wrote it walks away. Both values
          # are the kit's (`budget.call_sites` `claude.yml:claude` in the same
          # file); they change by a kit release and an upgrade fan-out.
          #
          # godotgo: --allowedTools keeps the shell to this workspace's own
          # scripts.
          claude_args: |
            --model claude-sonnet-5-5 --max-budget-usd 20
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(tools/check.sh*),Bash(tools/test.sh*),Bash(tools/smoke.sh*),Bash(tools/verify.sh*),Bash(tools/new_game.sh*),Bash(tools/godot.sh --headless*),Bash(python3 tools/gen_assets.py*)"
